[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "catnip-agent"
version = "0.1"
description = "Python Coding Agent Runtime — 11-layer architecture"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.mypy]
strict = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
